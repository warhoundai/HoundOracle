services:
  oracle:
    build:
      context: ../..
      dockerfile: deployment/selfhost/Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      HOUNDORACLE_API_KEY: ${HOUNDORACLE_API_KEY:?Set a local API access key of at least 24 characters}
    volumes:
      - evidence:/data
    networks:
      - offline
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  offline:
    internal: true
volumes:
  evidence:
