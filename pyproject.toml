[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "houndoracle"
version = "0.1.0.dev1"
description = "Local-first evidence-grounded verification infrastructure for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
captcha = ["ddddocr==1.6.1", "Pillow>=12.2,<14"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
mcp = ["mcp>=1.12,<2"]
semantic = ["transformers>=4.48,<5", "torch>=2.6,<3"]
s3 = ["boto3>=1.36,<2", "cryptography>=50,<51"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "build>=1.2,<2", "pip-audit>=2.9,<3"]
benchmark = [
    "google-genai>=1.50,<3",
    "huggingface-hub>=0.34,<2",
    "matplotlib>=3.10,<4",
    "onnxruntime>=1.22,<2",
    "scikit-learn>=1.7,<2",
    "tokenizers>=0.21,<1",
]

[project.scripts]
houndoracle = "houndoracle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/houndoracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
